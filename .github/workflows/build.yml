name: Build DRIP - Island

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build IslandWin.csproj -c Release "/flp:v=diag;logfile=build.log"

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish
        run: >
          dotnet publish IslandWin.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Generate Snapshots
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\publish\IslandWin.exe -ArgumentList '--snapshot','snapshots' -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { throw "snapshot failed with exit code: $($p.ExitCode)" }

      - name: Upload Snapshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslandWin
          path: publish/IslandWin.exe
